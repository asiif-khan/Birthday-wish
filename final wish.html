<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Happy Birthday Love ❤️</title>
    
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-glow: #1a0518;
            --bg-dark: #050106;
            --accent-pink: #ff1493;
            --accent-gold: #ffd57a;
            --text-color: #ffffff;
            --font-cursive: 'Dancing Script', cursive;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 30% 30%, var(--bg-glow) 0%, var(--bg-dark) 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            height: 100vh;
            height: 100svh;
            font-family: var(--font-sans);
            color: var(--text-color);
        }

        /* Dual Canvas Layout */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #treeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Typewriter text on top */
        #text-container {
            position: absolute;
            left: 8%;
            top: 25%;
            z-index: 10;
            width: 35%;
            font-family: var(--font-cursive);
            font-size: 2.2rem;
            line-height: 1.8;
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
            word-wrap: break-word;
        }

        /* Blinking typing cursor */
        .cursor {
            display: inline-block;
            width: 12px;
            height: 28px;
            background-color: var(--accent-pink);
            margin-left: 8px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            box-shadow: 0 0 10px var(--accent-pink);
            border-radius: 2px;
        }

        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: var(--accent-pink); }
        }

        /* Floating Audio Controls */
        .music-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(25, 10, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .music-toggle:active {
            transform: scale(0.92);
        }

        .music-toggle svg {
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.7);
            transition: fill 0.3s;
        }

        .music-toggle.playing svg {
            fill: var(--accent-gold);
            animation: vinylRotate 3s linear infinite;
        }

        @keyframes vinylRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .audio-hint {
            position: absolute;
            top: 75px;
            right: 24px;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            color: var(--accent-gold);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 99;
            font-family: var(--font-sans);
        }

        /* Interactive touch prompt */
        .tap-prompt {
            position: absolute;
            bottom: 24px;
            left: 24px;
            font-size: 12px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            z-index: 10;
            pointer-events: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Responsive Layout details for mobile viewports */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                justify-content: flex-start;
            }
            #text-container {
                position: relative;
                width: 86%;
                left: auto;
                top: auto;
                margin: 40px auto 20px auto;
                text-align: center;
                font-size: 1.6rem;
                line-height: 1.6;
            }
            .tap-prompt {
                left: 0;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Background canvas for stars & floating touch-burst hearts -->
    <canvas id="bgCanvas"></canvas>

    <!-- Foreground canvas for the growing fractal tree -->
    <canvas id="treeCanvas"></canvas>

    <!-- Typewriter target -->
    <div id="text-container">
        <span id="typewriter-text"></span>
        <div id="btn-container" style="margin-top: 24px; opacity: 0; visibility: hidden; transition: opacity 1s, visibility 1s;">
        </div>
    </div>

    <!-- Interactive Tap prompt -->
    <div class="tap-prompt">✨ Click anywhere to spawn hearts ✨</div>

    <!-- Floating Audio Toggle -->
    <button id="music-toggle" class="music-toggle" aria-label="Toggle background music">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
      </svg>
    </button>
    <div id="audio-hint" class="audio-hint"></div>

    <script>
        // --- CONFIGURATION ---
        const message = `Happy birthday love❤️
We will shine one day in life ❤️
Always be happy 🕊️
life is too short to argue  😊
stay happy and spread happiness😉
I love you ❤️❤️❤️
 ...`;

        const colors = [
            '#ff0a54', '#ff477e', '#ff7096', '#ff85a1',
            '#fbb1bd', '#f9bec7', '#ffb703', '#fb8500', '#ffffff'
        ];

        // --- DOM Elements ---
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const treeCanvas = document.getElementById('treeCanvas');
        const treeCtx = treeCanvas.getContext('2d');
        const textContainer = document.getElementById('text-container');

        // Resize Canvas to fit screen
        function resizeCanvases() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            treeCanvas.width = window.innerWidth;
            treeCanvas.height = window.innerHeight;
        }
        resizeCanvases();

        // --- TYPEWRITER EFFECT ---
        let charIndex = 0;
        const typeSpeed = 45;
        const typewriterText = document.getElementById('typewriter-text');

        function typeWriter() {
            if (charIndex < message.length) {
                const char = message.charAt(charIndex);
                
                // Remove cursor temporarily
                const cursor = textContainer.querySelector('.cursor');
                if (cursor) cursor.remove();
                
                if (char === '\n') {
                    typewriterText.innerHTML += '<br>';
                } else {
                    typewriterText.innerHTML += char;
                }
                
                typewriterText.innerHTML += '<span class="cursor"></span>';
                charIndex++;
                setTimeout(typeWriter, typeSpeed);
            } else {
                // Keep cursor blinking for 4s, then fade out
                setTimeout(() => {
                    const cursor = textContainer.querySelector('.cursor');
                    if (cursor) {
                        cursor.style.transition = 'opacity 1.5s';
                        cursor.style.opacity = '0';
                        setTimeout(() => cursor.remove(), 1500);
                    }
                }, 4000);

                // Show the "One More Thing..." button after typewriter is complete
                const btnContainer = document.getElementById('btn-container');
                if (btnContainer) {
                    btnContainer.style.visibility = 'visible';
                    btnContainer.style.opacity = '1';
                }
            }
        }

        // --- BACKGROUND FLOATING PARTICLES & SPARKS ---
        let bgParticles = [];
        let clickHearts = [];

        class AmbientParticle {
            constructor() {
                this.reset(true);
            }
            reset(randomY = false) {
                this.x = Math.random() * bgCanvas.width;
                this.y = randomY ? Math.random() * bgCanvas.height : bgCanvas.height + 20;
                this.size = Math.random() * 3 + 1.5;
                this.speed = Math.random() * 0.4 + 0.15;
                this.opacity = Math.random() * 0.4 + 0.1;
                this.wobbleSpeed = Math.random() * 0.02 + 0.005;
                this.angle = Math.random() * Math.PI * 2;
            }
            update() {
                this.y -= this.speed;
                this.angle += this.wobbleSpeed;
                this.x += Math.sin(this.angle) * 0.25;
                if (this.y < -20) this.reset(false);
            }
            draw() {
                bgCtx.save();
                bgCtx.globalAlpha = this.opacity;
                bgCtx.fillStyle = 'rgba(255, 112, 150, 0.6)';
                bgCtx.shadowBlur = 8;
                bgCtx.shadowColor = 'var(--accent-pink)';
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.restore();
            }
        }

        // Initialize background stars
        for (let j = 0; j < 35; j++) {
            bgParticles.push(new AmbientParticle());
        }

        // Helper function to draw heart shapes on canvas
        function drawHeart(ctx, x, y, size, rotation, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.fillStyle = color;
            ctx.shadowBlur = 6;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size / 2, -size / 2, -size, size / 3, 0, size);
            ctx.bezierCurveTo(size, size / 3, size / 2, -size / 2, 0, 0);
            ctx.fill();
            ctx.restore();
        }

        // Spark heart class on tap/click
        class ClickHeart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 6;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedX = Math.random() * 5 - 2.5;
                this.speedY = Math.random() * -4 - 2;
                this.opacity = 1;
                this.decay = Math.random() * 0.02 + 0.012;
                this.rotation = (Math.random() - 0.5) * 0.6;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.05; // slight gravity drift
                this.opacity -= this.decay;
            }
            draw() {
                bgCtx.save();
                bgCtx.globalAlpha = this.opacity;
                drawHeart(bgCtx, this.x, this.y, this.size, this.rotation, this.color);
                bgCtx.restore();
            }
        }

        // Interactive click hooks
        window.addEventListener('click', (e) => {
            if (e.target.closest('#music-toggle')) return;
            for (let k = 0; k < 8; k++) {
                clickHearts.push(new ClickHeart(e.clientX, e.clientY));
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#music-toggle')) return;
            const touch = e.touches[0];
            for (let k = 0; k < 8; k++) {
                clickHearts.push(new ClickHeart(touch.clientX, touch.clientY));
            }
        }, { passive: true });

        // Animating background loops
        function animateBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            // Render ambient stars
            bgParticles.forEach(p => {
                p.update();
                p.draw();
            });

            // Render click bursts
            clickHearts = clickHearts.filter(h => h.opacity > 0);
            clickHearts.forEach(h => {
                h.update();
                h.draw();
            });

            requestAnimationFrame(animateBackground);
        }
        animateBackground();


        // --- FRACTAL TREE ENGINE ---
        const maxDepth = 12;

        function drawBranch(x, y, len, angle, width, depth) {
            // End point mapping
            const endX = x + len * Math.sin(angle * Math.PI / 180);
            const endY = y - len * Math.cos(angle * Math.PI / 180);

            // Draw line segment
            treeCtx.beginPath();
            treeCtx.moveTo(x, y);
            treeCtx.lineTo(endX, endY);
            
            // Organic trunk wood gradient
            treeCtx.strokeStyle = `rgb(255, ${180 - depth * 11}, ${195 - depth * 11})`;
            treeCtx.lineWidth = width;
            treeCtx.lineCap = "round";
            treeCtx.stroke();

            // Render heart blooms
            if (depth > 8) {
                if (Math.random() > 0.35 || depth === maxDepth) {
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    const randomSize = 5 + Math.random() * 8;
                    const randomAngle = (Math.random() - 0.5) * 1.2;
                    drawHeart(treeCtx, endX, endY, randomSize, randomAngle, randomColor);
                }
            }

            if (depth >= maxDepth) return;

            // Recurse Left & Right branches with debounced timeouts
            setTimeout(() => {
                drawBranch(
                    endX, endY,
                    len * 0.8,
                    angle + 20 + (Math.random() * 8 - 4),
                    width * 0.72,
                    depth + 1
                );
            }, 30 + Math.random() * 45);

            setTimeout(() => {
                drawBranch(
                    endX, endY,
                    len * 0.8,
                    angle - 20 + (Math.random() * 8 - 4),
                    width * 0.72,
                    depth + 1
                );
            }, 30 + Math.random() * 45);
        }

        // Coordinates configuration based on screen sizing
        let startX, startY, trunkLength;
        function setupTreeDimensions() {
            if (window.innerWidth < 768) {
                // Mobile layout
                startX = treeCanvas.width * 0.5;
                startY = treeCanvas.height * 0.95;
                trunkLength = Math.min(treeCanvas.height * 0.16, 95);
            } else {
                // Desktop layout
                startX = treeCanvas.width * 0.72;
                startY = treeCanvas.height;
                trunkLength = 135;
            }
        }

        // --- INITIAL START ---
        typeWriter();
        setupTreeDimensions();
        
        setTimeout(() => {
            drawBranch(startX, startY, trunkLength, 0, 16, 0);
        }, 600);


        // --- DEBOUNCED RESIZE REDRAW SYSTEM ---
        let resizeTimeout;
        window.addEventListener('resize', () => {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            bgParticles.forEach(p => p.reset(true));

            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                treeCtx.clearRect(0, 0, treeCanvas.width, treeCanvas.height);
                treeCanvas.width = window.innerWidth;
                treeCanvas.height = window.innerHeight;
                setupTreeDimensions();
                drawBranch(startX, startY, trunkLength, 0, 16, 0);
            }, 400);
        });


        // --- AUDIO COMPLIANCE SYSTEM ---
        let audio = new Audio('audio/birthday.mp3');
        audio.loop = true;
        let isMuted = true;
        
        const musicToggle = document.getElementById('music-toggle');
        const audioHint = document.getElementById('audio-hint');

        audio.addEventListener('error', () => {
            console.warn("Audio file 'audio/birthday.mp3' not found. Disabling music toggle.");
            if (musicToggle) musicToggle.style.display = 'none';
        });

        if (musicToggle) {
            musicToggle.addEventListener('click', () => {
                if (isMuted) {
                    audio.play().then(() => {
                        isMuted = false;
                        musicToggle.classList.add('playing');
                        showAudioHint("Music On 🎵");
                    }).catch(err => {
                        console.error("Autoplay blocked:", err);
                        showAudioHint("Play Blocked ❌");
                    });
                } else {
                    audio.pause();
                    isMuted = true;
                    musicToggle.classList.remove('playing');
                    showAudioHint("Muted 🔇");
                }
            });
        }

        function showAudioHint(text) {
            if (!audioHint) return;
            audioHint.textContent = text;
            audioHint.style.opacity = '1';
            setTimeout(() => {
                audioHint.style.opacity = '0';
            }, 1500);
        }
    </script>
</body>
</html>
